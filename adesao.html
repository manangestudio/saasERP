<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Adesão GEF</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background: #0b0f19;
            color: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 20px 60px rgba(0,0,0,.35);
        }

        h1 {
            margin: 0 0 8px;
            font-size: 28px;
        }

        .subtitle {
            color: #94a3b8;
            margin-bottom: 28px;
        }

        .ambassador {
            display: none;
            background: #172033;
            border: 1px solid #263550;
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 24px;
        }

        .ambassador strong {
            display: block;
            margin-bottom: 5px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .full {
            grid-column: 1 / -1;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            color: #cbd5e1;
        }

        input {
            width: 100%;
            padding: 12px 13px;
            border-radius: 8px;
            border: 1px solid #374151;
            background: #0f172a;
            color: #fff;
            outline: none;
        }

        input:focus {
            border-color: #64748b;
        }

        button {
            width: 100%;
            margin-top: 24px;
            padding: 14px;
            border: 0;
            border-radius: 8px;
            background: #2563eb;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        button:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        .message {
            display: none;
            margin-top: 18px;
            padding: 13px;
            border-radius: 8px;
            line-height: 1.5;
        }

        .error {
            background: #451a1a;
            border: 1px solid #7f1d1d;
            color: #fecaca;
        }

        .success {
            background: #052e16;
            border: 1px solid #166534;
            color: #bbf7d0;
        }

        @media (max-width: 600px) {
            .container {
                padding: 22px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .full {
                grid-column: auto;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Adesão GEF</h1>

    <div class="subtitle">
        Registe a sua empresa e comece a utilizar o sistema GEF.
    </div>

    <div id="ambassador-box" class="ambassador">
        <strong>Embaixador</strong>
        <span id="ambassador-name"></span>
    </div>

    <form id="adesao-form">

        <div class="form-grid">

            <div class="full">
                <label for="storeName">Nome da empresa / loja *</label>
                <input id="storeName" name="storeName" required>
            </div>

            <div>
                <label for="ownerName">Nome do responsável *</label>
                <input id="ownerName" name="ownerName" required>
            </div>

            <div>
                <label for="phone">Telefone *</label>
                <input id="phone" name="phone" required>
            </div>

            <div>
                <label for="city">Cidade *</label>
                <input id="city" name="city" required>
            </div>

            <div>
                <label for="nuitNif">NUIT / NIF</label>
                <input id="nuitNif" name="nuitNif">
            </div>

            <div class="full">
                <label for="address">Endereço</label>
                <input id="address" name="address">
            </div>

            <div>
                <label for="monthlyFee">Mensalidade</label>
                <input
                    id="monthlyFee"
                    name="monthlyFee"
                    type="number"
                    min="0"
                    step="0.01"
                    value="0"
                >
            </div>

            <div>
                <label for="adminEmail">E-mail do administrador *</label>
                <input
                    id="adminEmail"
                    name="adminEmail"
                    type="email"
                    required
                >
            </div>

            <div>
                <label for="adminPassword">Palavra-passe *</label>
                <input
                    id="adminPassword"
                    name="adminPassword"
                    type="password"
                    minlength="6"
                    required
                >
            </div>

        </div>

        <button id="submit-btn" type="submit">
            Criar conta e registar empresa
        </button>

    </form>

    <div id="message" class="message"></div>

</div>

<script type="module" src="./js/adesao.js"></script>

</body>
</html>
