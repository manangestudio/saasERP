<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Adesão | GEF Gestão Financeira</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background: #0b0f19;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }

        .card {
            width: 100%;
            max-width: 620px;
            background: #111827;
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 20px 60px rgba(0,0,0,.35);
        }

        h1 {
            margin-top: 0;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #9ca3af;
            margin-bottom: 28px;
        }

        .ambassador {
            padding: 14px 16px;
            background: rgba(255,255,255,.05);
            border-radius: 10px;
            margin-bottom: 24px;
        }

        .ambassador strong {
            display: block;
            margin-bottom: 4px;
        }

        .field {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            border-radius: 8px;
            border: 1px solid #374151;
            background: #0f172a;
            color: #fff;
            outline: none;
        }

        input:focus {
            border-color: #60a5fa;
        }

        .section-title {
            margin-top: 28px;
            margin-bottom: 16px;
            font-size: 18px;
        }

        button {
            width: 100%;
            border: 0;
            border-radius: 8px;
            padding: 14px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            background: #2563eb;
            color: #fff;
        }

        button:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        .message {
            margin-top: 18px;
            padding: 12px;
            border-radius: 8px;
            display: none;
        }

        .message.show {
            display: block;
        }

        .success {
            background: rgba(34,197,94,.12);
            color: #86efac;
        }

        .error {
            background: rgba(239,68,68,.12);
            color: #fca5a5;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>

<body>

<div class="card">

    <h1>Adesão ao GEF</h1>

    <div class="subtitle">
        Cadastre a sua loja e crie o administrador da sua conta.
    </div>

    <div id="ambassadorBox" class="ambassador hidden">
        <strong>Embaixador</strong>
        <span id="ambassadorName"></span>
    </div>

    <form id="adesaoForm">

        <div class="section-title">
            Dados da loja
        </div>

        <div class="field">
            <label for="storeName">Nome da loja *</label>
            <input id="storeName" required>
        </div>

        <div class="field">
            <label for="ownerName">Nome do responsável *</label>
            <input id="ownerName" required>
        </div>

        <div class="field">
            <label for="phone">Telefone *</label>
            <input id="phone" required>
        </div>

        <div class="field">
            <label for="city">Cidade *</label>
            <input id="city" required>
        </div>

        <div class="field">
            <label for="address">Endereço</label>
            <input id="address">
        </div>

        <div class="field">
            <label for="nuitNif">NUIT / NIF</label>
            <input id="nuitNif">
        </div>

        <div class="field">
            <label for="monthlyFee">Mensalidade</label>
            <input id="monthlyFee" type="number" min="0" step="0.01" value="0">
        </div>

        <div class="section-title">
            Acesso do administrador
        </div>

        <div class="field">
            <label for="adminEmail">Email *</label>
            <input id="adminEmail" type="email" required>
        </div>

        <div class="field">
            <label for="adminPassword">Password *</label>
            <input id="adminPassword" type="password" minlength="6" required>
        </div>

        <button id="submitBtn" type="submit">
            Criar loja e acesso
        </button>

    </form>

    <div id="message" class="message"></div>

</div>

<script type="module" src="./js/adesao.js"></script>

</body>
</html>
